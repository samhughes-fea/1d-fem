name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Install the optional geometry kernel (Python 3.11 and later)
        if: matrix.python-version != '3.10'
        run: pip install -r requirements-geometry.txt
      - name: Run tests
        env:
          FEM_FORMULATION_CACHE_STRICT_SHAPE: "1"
        run: python -m pytest tests -q -n auto --durations=20
