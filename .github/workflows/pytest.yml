name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt && pip install -e .
      - name: Install GEOS, which the geometry kernel loads
        run: sudo apt-get update && sudo apt-get install -y libgeos-dev
      - name: Install the section provider and the optional geometry kernel
        run: pip install -r requirements-sections.txt -r requirements-geometry.txt
      - name: Run tests
        env:
          FEM_FORMULATION_CACHE_STRICT_SHAPE: "1"
        run: python -m pytest tests -q -n auto --durations=20
